<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  #stage{position:relative;width:390px;height:600px;margin:0 auto;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 42%, #FFFDF8 0%, #FBF6EC 55%, #F4ECDD 100%)}
  /* one soft warm bloom — not god-rays */
  .bloom{position:absolute;left:50%;top:262px;width:430px;height:430px;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(224,178,74,.20), rgba(224,178,74,0) 62%)}
  .ringwrap{position:absolute;left:50%;top:262px;transform:translate(-50%,-50%);width:248px;height:248px}
  .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .num{font-family:Fraunces;font-weight:600;font-size:62px;color:#2E2A24;letter-spacing:-.02em;line-height:1}
  .lab{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9C8A5E}
  .check{margin-top:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#E8C967,#C79A3C);
    box-shadow:0 4px 12px rgba(199,154,60,.4);color:#fff;font-size:16px;font-weight:800}
  .title{position:absolute;left:0;right:0;top:452px;text-align:center}
  .title .t1{font-family:Fraunces;font-weight:600;font-size:24px;color:#2E2A24}
  .title .t2{font-size:13px;font-weight:600;color:#9A9080;margin-top:6px}
  /* a few soft gold motes drifting up — restraint, not an explosion */
  .mote{position:absolute;border-radius:50%;background:radial-gradient(circle,#F0D88A,#D7A93F);opacity:.0}
</style></head>
<body>
<div id="stage">
  <div class="bloom"></div>
  <div class="ringwrap">
    <svg width="248" height="248" viewBox="0 0 248 248">
      <circle cx="124" cy="124" r="106" fill="none" stroke="#ECE4D4" stroke-width="14"/>
      <circle cx="124" cy="124" r="106" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round"
              transform="rotate(-90 124 124)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#86A98C"/><stop offset="1" stop-color="#D7A93F"/></linearGradient></defs>
    </svg>
    <div class="ctr">
      <div class="num">96g</div>
      <div class="lab">Protein</div>
      <div class="check">&#10003;</div>
    </div>
  </div>
  <div class="title">
    <div class="t1">Protein goal reached</div>
    <div class="t2">7-day streak &middot; your strongest week yet</div>
  </div>
  <div id="motes"></div>
</div>
<script>
  // a handful of slow-drifting gold motes (the ONLY particle accent)
  const m=document.getElementById('motes');
  for(let i=0;i<7;i++){const d=document.createElement('div');d.className='mote';
    const s=4+Math.random()*5;d.style.width=s+'px';d.style.height=s+'px';
    d.style.left=(150+Math.random()*90)+'px';d.style.top=(300+Math.random()*40)+'px';
    d.style.opacity=(.25+Math.random()*.4);
    d.style.transform=`translateY(${-Math.random()*60}px)`;m.appendChild(d);}
</script>
</body></html>
