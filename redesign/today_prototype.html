<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapCal — warm premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EEE3;          /* warm background */
    --card:#FFFCF6;           /* warm white card */
    --ink:#2E2A24;            /* deep warm charcoal */
    --muted:#9A9081;          /* soft taupe text */
    --line:#EBE3D5;           /* hairline */
    --sage:#6E8E73;           /* calm primary */
    --sage-deep:#5C7A62;
    --sage-soft:#E4EBE1;      /* ring track / chips */
    --gold:#C7A24E;           /* the warm jewel accent */
    --gold-soft:#F0E4C6;
    --tan:#D8B68A;            /* carbs */
    --rose:#C98B7A;           /* a touch of warmth for fat */
    --shadow:0 6px 24px rgba(74,60,33,.08);
    --shadow-sm:0 2px 10px rgba(74,60,33,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif}
  body{padding:0 18px 110px;max-width:430px;margin:0 auto}
  .h-serif{font-family:Fraunces,Georgia,serif}
  .num{font-family:Fraunces,Georgia,serif;font-variant-numeric:lining-nums tabular-nums}

  header{padding:22px 4px 14px}
  header h1{font-family:Fraunces;font-weight:600;font-size:32px;line-height:1;letter-spacing:-.01em;margin:0}
  header .date{color:var(--muted);font-size:13.5px;font-weight:500;margin-top:6px;letter-spacing:.02em}

  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}

  /* HERO ring card */
  .hero{display:flex;flex-direction:column;align-items:center;padding-top:26px;padding-bottom:18px}
  .ringwrap{position:relative;width:220px;height:220px}
  .ringwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ringwrap .big{font-family:Fraunces;font-weight:600;font-size:54px;line-height:.9;letter-spacing:-.02em}
  .ringwrap .cap{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
  .macros{display:flex;gap:8px;width:100%;margin-top:20px}
  .macro{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}
  .macro .mlabel{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .macro .mval{font-family:Fraunces;font-weight:600;font-size:16px;margin-top:-2px}
  .miniring{width:46px;height:46px}

  /* Coach Cal slim */
  .coach{display:flex;align-items:center;gap:14px;padding:16px 18px}
  .coach .av{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--sage),var(--sage-deep));color:#fff;font-size:20px;box-shadow:var(--shadow-sm)}
  .coach .ctext{flex:1;min-width:0}
  .coach .ctitle{font-weight:700;font-size:14px}
  .coach .csub{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.3}
  .coach .cgo{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);
    background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:18px;color:#9C7B2E}

  /* primary / quiet buttons */
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-family:Inter;font-weight:700;font-size:15px;cursor:pointer}
  .btn-primary{background:var(--sage);color:#fff;box-shadow:0 8px 18px rgba(110,142,115,.28)}
  .row2{display:flex;gap:12px}
  .tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:16px 16px 18px}
  .tile .tlab{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .tile .tval{font-family:Fraunces;font-weight:600;font-size:26px;margin-top:10px}
  .tile .tval small{font-size:13px;color:var(--muted);font-family:Inter;font-weight:600}
  .tbar{height:7px;border-radius:99px;background:var(--sage-soft);margin-top:12px;overflow:hidden}
  .tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--gold))}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}

  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;height:84px;background:rgba(255,252,246,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 10px 0;max-width:430px;margin:0 auto}
  .nv{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;width:60px}
  .nv svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
  .nv.active{color:var(--sage-deep)}
  .nv.active .nvdot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:1px}
  .fab{width:62px;height:62px;border-radius:50%;margin-top:-22px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--sage),var(--sage-deep));box-shadow:0 10px 22px rgba(92,122,98,.45);border:3px solid var(--gold)}
  .fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9}
  .fab-lab{font-size:11px;font-weight:700;color:var(--sage-deep);margin-top:4px}
</style>
</head>
<body>
  <header>
    <h1>Your Day</h1>
    <div class="date">Monday, June 29</div>
  </header>

  <!-- HERO -->
  <section class="card hero">
    <div class="ringwrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="96" fill="none" stroke="var(--sage-soft)" stroke-width="15"/>
        <circle cx="110" cy="110" r="96" fill="none" stroke="url(#g1)" stroke-width="15" stroke-linecap="round"
                stroke-dasharray="603" stroke-dashoffset="181" transform="rotate(-90 110 110)"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7E9C82"/><stop offset="1" stop-color="#C7A24E"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="center">
        <div class="big num">1,420</div>
        <div class="cap">calories left</div>
      </div>
    </div>

    <div class="macros">
      <div class="macro">
        <svg class="miniring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--sage)" stroke-width="5" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="34" transform="rotate(-90 23 23)"/></svg>
        <div class="mval num">96<small style="font-size:11px;color:var(--muted)">g</small></div>
        <div class="mlabel">Protein</div>
      </div>
      <div class="macro">
        <svg class="miniring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--tan)" stroke-width="5" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="50" transform="rotate(-90 23 23)"/></svg>
        <div class="mval num">140<small style="font-size:11px;color:var(--muted)">g</small></div>
        <div class="mlabel">Carbs</div>
      </div>
      <div class="macro">
        <svg class="miniring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="23" cy="23" r="18" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="68" transform="rotate(-90 23 23)"/></svg>
        <div class="mval num">38<small style="font-size:11px;color:var(--muted)">g</small></div>
        <div class="mlabel">Fat</div>
      </div>
    </div>
  </section>

  <!-- Coach Cal slim -->
  <section class="card coach">
    <div class="av">✦</div>
    <div class="ctext">
      <div class="ctitle">Coach Cal</div>
      <div class="csub">Great protein start — let's keep it rolling at lunch.</div>
    </div>
    <div class="cgo">›</div>
  </section>

  <button class="btn btn-primary">Scan your next meal</button>

  <div class="row2" style="margin-top:16px">
    <div class="tile">
      <div class="tlab"><span class="dot"></span> Water</div>
      <div class="tval num">5 <small>/ 8 cups</small></div>
      <div class="tbar"><i style="width:62%"></i></div>
    </div>
    <div class="tile">
      <div class="tlab"><span class="dot"></span> Move</div>
      <div class="tval num">6,240 <small>steps</small></div>
      <div class="tbar"><i style="width:78%"></i></div>
    </div>
  </div>

  <!-- bottom nav -->
  <nav>
    <div class="nv active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Today</span><div class="nvdot"></div>
    </div>
    <div class="nv">
      <svg viewBox="0 0 24 24"><path d="M6 3v8M9 3v8M7.5 11v10M16 3c-2 1-2 5-2 7h4M14 10v11"/></svg>
      <span>Eat Out</span>
    </div>
    <div class="nv">
      <div class="fab"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h0a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg></div>
      <span class="fab-lab">Scan</span>
    </div>
    <div class="nv">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 4-6"/></svg>
      <span>History</span>
    </div>
    <div class="nv">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg>
      <span>Profile</span>
    </div>
  </nav>
</body>
</html>
