<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapCal — bright premium v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#FFFEFB; --bg2:#F7F1E7;     /* brighter, airier warm */
    --card:#FFFFFF;                    /* clean bright cards */
    --ink:#27241F; --muted:#9D9486; --line:#F0E9DC;
    --sage:#6FA079; --sage-deep:#558A63; --sage-soft:#E7F1E8;
    --gold:#E0B24A; --gold-deep:#B98A28; --gold-soft:#FBEFCB;
    --tan:#E0BC8C; --shadow:0 8px 26px rgba(60,52,30,.07); --shadow-sm:0 3px 12px rgba(60,52,30,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif}
  body{padding:0 18px 110px;max-width:430px;margin:0 auto;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg1) 30%,var(--bg2) 100%);min-height:100vh}
  .num{font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}

  header{padding:24px 4px 16px}
  header h1{font-weight:800;font-size:29px;line-height:1;letter-spacing:-.02em;margin:0}
  header .date{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:7px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px;margin-bottom:16px}

  .hero{display:flex;flex-direction:column;align-items:center;padding-top:30px;padding-bottom:20px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-40px;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle, rgba(224,178,74,.12), rgba(224,178,74,0) 70%)}
  .ringwrap{position:relative;width:228px;height:228px}
  .ringwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ringwrap .big{font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.03em}
  .ringwrap .cap{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:9px}
  .macros{display:flex;gap:8px;width:100%;margin-top:22px}
  .macro{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}
  .macro .mlabel{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .macro .mval{font-weight:800;font-size:16px}
  .macro .mval small{font-weight:600;font-size:11px;color:var(--muted)}
  .miniring{width:48px;height:48px}

  .coach{display:flex;align-items:center;gap:14px;padding:16px 18px}
  .coach .av{width:44px;height:44px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#7FB089,var(--sage-deep));color:#fff;font-size:20px;box-shadow:0 6px 14px rgba(85,138,99,.3)}
  .coach .ctext{flex:1;min-width:0}
  .coach .ctitle{font-weight:800;font-size:14.5px}
  .coach .csub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.35;font-weight:500}
  .coach .cgo{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold-deep);font-weight:800}

  .btn{display:block;width:100%;border:none;border-radius:18px;padding:16px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .btn-primary{background:var(--sage);color:#fff;box-shadow:0 10px 20px rgba(111,160,121,.32)}
  .row2{display:flex;gap:12px}
  .tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:16px 16px 18px}
  .tile .tlab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .tile .tval{font-weight:800;font-size:25px;margin-top:11px}
  .tile .tval small{font-size:12.5px;color:var(--muted);font-weight:600}
  .tbar{height:7px;border-radius:99px;background:var(--sage-soft);margin-top:13px;overflow:hidden}
  .tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--gold))}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}

  nav{position:fixed;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding:12px 10px 0;max-width:430px;margin:0 auto}
  .nv{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:700;width:60px}
  .nv svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9}
  .nv.active{color:var(--sage-deep)}
  .nv.active .nvdot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:1px}
  .fab{width:62px;height:62px;border-radius:50%;margin-top:-22px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#7FB089,var(--sage-deep));box-shadow:0 12px 24px rgba(85,138,99,.45);border:3px solid #fff;outline:2px solid var(--gold)}
  .fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
  .fab-lab{font-size:11px;font-weight:800;color:var(--sage-deep);margin-top:5px}
</style>
</head>
<body>
  <header><h1>Your Day</h1><div class="date">Monday, June 29</div></header>

  <section class="card hero">
    <div class="ringwrap">
      <svg width="228" height="228" viewBox="0 0 228 228">
        <circle cx="114" cy="114" r="98" fill="none" stroke="var(--sage-soft)" stroke-width="16"/>
        <circle cx="114" cy="114" r="98" fill="none" stroke="url(#g1)" stroke-width="16" stroke-linecap="round"
                stroke-dasharray="616" stroke-dashoffset="185" transform="rotate(-90 114 114)"/>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7FB089"/><stop offset="1" stop-color="#E0B24A"/></linearGradient></defs>
      </svg>
      <div class="center"><div class="big num">1,420</div><div class="cap">calories left</div></div>
    </div>
    <div class="macros">
      <div class="macro"><svg class="miniring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="24" cy="24" r="19" fill="none" stroke="var(--sage)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119" stroke-dashoffset="36" transform="rotate(-90 24 24)"/></svg><div class="mval num">96<small>g</small></div><div class="mlabel">Protein</div></div>
      <div class="macro"><svg class="miniring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="24" cy="24" r="19" fill="none" stroke="var(--tan)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119" stroke-dashoffset="53" transform="rotate(-90 24 24)"/></svg><div class="mval num">140<small>g</small></div><div class="mlabel">Carbs</div></div>
      <div class="macro"><svg class="miniring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="var(--sage-soft)" stroke-width="5"/><circle cx="24" cy="24" r="19" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119" stroke-dashoffset="72" transform="rotate(-90 24 24)"/></svg><div class="mval num">38<small>g</small></div><div class="mlabel">Fat</div></div>
    </div>
  </section>

  <section class="card coach">
    <div class="av">✦</div>
    <div class="ctext"><div class="ctitle">Coach Cal</div><div class="csub">Great protein start — let's keep it rolling at lunch.</div></div>
    <div class="cgo">›</div>
  </section>

  <button class="btn btn-primary">Scan your next meal</button>

  <div class="row2" style="margin-top:16px">
    <div class="tile"><div class="tlab"><span class="dot"></span> Water</div><div class="tval num">5 <small>/ 8 cups</small></div><div class="tbar"><i style="width:62%"></i></div></div>
    <div class="tile"><div class="tlab"><span class="dot"></span> Move</div><div class="tval num">6,240 <small>steps</small></div><div class="tbar"><i style="width:78%"></i></div></div>
  </div>

  <nav>
    <div class="nv active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Today</span><div class="nvdot"></div></div>
    <div class="nv"><svg viewBox="0 0 24 24"><path d="M6 3v8M9 3v8M7.5 11v10M16 3c-2 1-2 5-2 7h4M14 10v11"/></svg><span>Eat Out</span></div>
    <div class="nv"><div class="fab"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h0a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg></div><span class="fab-lab">Scan</span></div>
    <div class="nv"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l3-4 3 2 4-6"/></svg><span>History</span></div>
    <div class="nv"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/></svg><span>Profile</span></div>
  </nav>
</body>
</html>
