# Cloudflare-style one-click deploy blueprint for Render (render.com).
# Deploys the SnapCal API. Live service srv-d8smnra8qa3s73bge1cg runs on "starter" (always-warm)
# with the persistent disk below attached + SNAPCAL_DB_DIR set (done 2026-07-19 via Render API,
# durability verified: a meal survives a redeploy). Keep this file in sync with the dashboard.
services:
  - type: web
    name: snapcal-api
    runtime: python
    plan: starter            # always-warm ($7/mo). REQUIRED for the persistent disk below (disks need a paid plan).
    region: ohio             # closest US region to PA
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    # PERSISTENT DISK — keeps snapcal.db (ALL user history) across every redeploy/update. ATTACHED + LIVE.
    # Without this, the DB sits on the ephemeral container FS and EVERY deploy wipes all logged meals.
    disk:
      name: snapcal-data
      mountPath: /var/data
      sizeGB: 1                  # ~$0.25/mo; SQLite for thousands of users fits easily
    envVars:
      - key: SNAPCAL_DB_DIR      # app writes snapcal.db here so history SURVIVES redeploys
        value: /var/data
      - key: GEMINI_API_KEY      # set in the Render dashboard (Secret) — never committed
        sync: false
      - key: SNAPCAL_PEXELS_KEY  # set in the Render dashboard (Secret) — real per-dish photos
        sync: false
      - key: USDA_API_KEY        # set in the Render dashboard (Secret) — free api.data.gov key, removes the demo rate limit
        sync: false
      - key: CORS_ORIGINS        # extra web origins allowed to call the API (comma-separated)
        value: https://xionprotech.com
